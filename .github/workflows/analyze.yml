name: Analyze B-Roll Clips

on:
  # Manual: Actions tab -> "Run workflow" -> fill in the fields
  workflow_dispatch:
    inputs:
      clips_dir:
        description: "Local folder (inside the runner) to download clips into / analyze"
        required: false
        default: "clips"
      drive_folder_id:
        description: "Google Drive folder ID (leave blank to use the DRIVE_FOLDER_ID repo secret)"
        required: false

  # Automatic: runs every 30 minutes. Scheduled runs have no form to fill in,
  # so they always use the DRIVE_FOLDER_ID repo secret (Settings > Secrets
  # and variables > Actions > Secrets tab) — it MUST be set or this job
  # will fail (see the "Validate inputs" step below).
  schedule:
    - cron: "*/30 * * * *"

# Prevents overlapping runs: if a run is still going when the next scheduled
# trigger fires, the new one waits in queue instead of starting in parallel.
concurrency:
  group: broll-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      # Manual run: use whatever was typed in the form (falls back to the
      # repo secret if left blank). Scheduled run: always uses the secret.
      CLIPS_DIR: ${{ github.event.inputs.clips_dir || 'clips' }}
      DRIVE_FOLDER_ID: ${{ github.event.inputs.drive_folder_id || secrets.DRIVE_FOLDER_ID }}
    steps:
      - name: Validate inputs
        run: |
          if [ -z "$DRIVE_FOLDER_ID" ]; then
            echo "::error::DRIVE_FOLDER_ID is empty. This run had no form value AND the repo secret DRIVE_FOLDER_ID is not set (or is empty). Go to Settings > Secrets and variables > Actions > Secrets tab and add DRIVE_FOLDER_ID with your Drive folder's ID."
            exit 1
          fi
          echo "Using DRIVE_FOLDER_ID=$DRIVE_FOLDER_ID, CLIPS_DIR=$CLIPS_DIR"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone (Google service account)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_KEY" > /tmp/sa.json
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/sa.json
          EOF

      - name: Download clips from Drive
        run: |
          mkdir -p "$CLIPS_DIR"
          # Recursive copy — pulls the clips AND any existing des/ subfolder
          # (previous broll_auto.csv / broll_metadata.json), so resume-by-CSV works.
          rclone copy "gdrive:" "$CLIPS_DIR" \
            --drive-root-folder-id "$DRIVE_FOLDER_ID" -P

      - name: Check clips were actually found
        run: |
          count=$(find "$CLIPS_DIR" -maxdepth 1 -type f \
            \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.m4v" -o -iname "*.avi" -o -iname "*.mkv" -o -iname "*.webm" \) | wc -l)
          echo "Found $count video file(s) in $CLIPS_DIR"
          if [ "$count" -eq 0 ]; then
            echo "::error::0 video files found after downloading from Drive folder $DRIVE_FOLDER_ID. Either the folder ID is wrong, or the folder is empty, or it wasn't shared with the service account (see PART D of DEPLOYMENT_GUIDE.md)."
            exit 1
          fi

      - name: Run analyzer
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PYTHONUNBUFFERED: "1"
        run: python -u cli.py "$CLIPS_DIR"

      # Results (broll_auto.csv, broll_metadata.json, duration cache) land in
      # <clips_dir>/des/ next to the downloaded clips.

      - name: Upload results as workflow artifact (quick download)
        uses: actions/upload-artifact@v4
        with:
          name: broll-results
          path: ${{ env.CLIPS_DIR }}/des/

      - name: Push results back to Drive (so resume works next run)
        run: |
          rclone copy "$CLIPS_DIR/des" "gdrive:des" \
            --drive-root-folder-id "$DRIVE_FOLDER_ID" -P
