name: Analyze B-Roll Clips

on:
  # Manual: Actions tab -> "Run workflow" -> fill in the fields
  workflow_dispatch:
    inputs:
      clips_dir:
        description: "Local folder (inside the runner) to download clips into / analyze"
        required: false
        default: "clips"
      drive_folder_id:
        description: "Google Drive folder ID (leave blank to use the DRIVE_FOLDER_ID repo variable)"
        required: false

  # Automatic: runs every day at 03:00 UTC. Change the cron string to adjust timing.
  # Scheduled runs always use the DRIVE_FOLDER_ID repo variable (see below) since
  # there's no form to fill in when GitHub triggers this on its own.
  schedule:
    - cron: "*/30 * * * *"

# Prevents overlapping runs: if a run is still going when the next scheduled
# trigger fires, the new one waits in queue instead of starting in parallel.
concurrency:
  group: broll-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      # Manual run: use whatever was typed in the form (falls back to the repo
      # variable if left blank). Scheduled run: always uses the repo variable.
      CLIPS_DIR: ${{ github.event.inputs.clips_dir || 'clips' }}
      DRIVE_FOLDER_ID: ${{ github.event.inputs.drive_folder_id || vars.DRIVE_FOLDER_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone (Google service account)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_KEY" > /tmp/sa.json
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/sa.json
          EOF

      - name: Download clips from Drive
        run: |
          mkdir -p "$CLIPS_DIR"
          # Recursive copy — pulls the clips AND any existing des/ subfolder
          # (previous broll_auto.csv / broll_metadata.json), so resume-by-CSV works.
          rclone copy "gdrive:" "$CLIPS_DIR" \
            --drive-root-folder-id "$DRIVE_FOLDER_ID" -P

      - name: Run analyzer
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python cli.py "$CLIPS_DIR"

      # Results (broll_auto.csv, broll_metadata.json, duration cache) land in
      # <clips_dir>/des/ next to the downloaded clips.

      - name: Upload results as workflow artifact (quick download)
        uses: actions/upload-artifact@v4
        with:
          name: broll-results
          path: ${{ env.CLIPS_DIR }}/des/

      - name: Push results back to Drive (so resume works next run)
        run: |
          rclone copy "$CLIPS_DIR/des" "gdrive:des" \
            --drive-root-folder-id "$DRIVE_FOLDER_ID" -P
